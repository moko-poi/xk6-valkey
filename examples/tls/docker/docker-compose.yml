services:
  valkey:
    image: valkey/valkey:9.1.1
    restart: always
    # The official image has no env-var configuration API, so TLS is set up
    # through server flags. --port 0 disables the plaintext port.
    command: >
      valkey-server
      --requirepass tjkbZ8jrwz3pGiku
      --port 0
      --tls-port 6379
      --tls-cert-file /tls/valkey.crt
      --tls-key-file /tls/valkey.key
      --tls-ca-cert-file /tls/ca.crt
      --tls-auth-clients optional
      --loglevel verbose
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
      - ./tests/tls:/tls:ro

volumes:
  valkey_data:
    driver: local
